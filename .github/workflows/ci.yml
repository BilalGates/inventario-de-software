name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    name: Backend 2.0
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic/env.py ../api
      - run: pytest

  backend-postgres:
    # Misma batería contra PostgreSQL 16 (Supabase): detecta lo que SQLite tolera y Postgres no.
    name: Backend 2.0 (PostgreSQL)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: inventario, POSTGRES_PASSWORD: inventario, POSTGRES_DB: inventario_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inventario -d inventario_test" --health-interval 5s --health-retries 10
    env:
      INV_TEST_DATABASE_URL: postgresql://inventario:inventario@localhost:5432/inventario_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Migraciones de Alembic sobre PostgreSQL
        env: { INV_DATABASE_URL: "postgresql://inventario:inventario@localhost:5432/inventario_test" }
        run: python -c "import app.db as d, app.models; d.Base.metadata.drop_all(d.make_engine(__import__('os').environ['INV_DATABASE_URL']))" && alembic upgrade head

  frontend:
    name: Frontend + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
